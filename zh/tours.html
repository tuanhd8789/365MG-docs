<section class="wrap block narrow"><h1>操作演示</h1><p class="lead">每个演示都在真实界面上用动画光标重现一项任务。使用 ‹ › 逐步查看。</p>
  <figure class="tour" data-tour="addTenant">
  <figcaption class="tour-head"><strong>添加租户</strong><span class="muted">以全局管理员身份登录一次</span></figcaption>
  <div class="tour-stage"><img class="tour-img" alt="添加租户"><div class="tour-box"></div><div class="tour-cursor" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 2l16 9.5-7 1.6 3.9 7.3-2.9 1.5-3.9-7.3L5 19z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg></div><div class="tour-ripple"></div></div>
  <div class="tour-bar">
    <button type="button" class="tb" data-act="prev" aria-label="上一步">‹</button>
    <button type="button" class="tb tb-main" data-act="play">播放</button>
    <button type="button" class="tb" data-act="next" aria-label="下一步">›</button>
    <p class="tour-cap" aria-live="polite"></p>
    <span class="tour-count muted"></span>
  </div>
  <script type="application/json" class="tour-steps">["在侧边栏中打开“租户”。","单击“添加租户”：将打开浏览器窗口供全局管理员登录。","返回 365MG 后，租户会显示其权限检查结果和许可证。"]</script>
</figure>
<figure class="tour" data-tour="createCampaign">
  <figcaption class="tour-head"><strong>创建迁移任务</strong><span class="muted">从选择用户到保存</span></figcaption>
  <div class="tour-stage"><img class="tour-img" alt="创建迁移任务"><div class="tour-box"></div><div class="tour-cursor" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 2l16 9.5-7 1.6 3.9 7.3-2.9 1.5-3.9-7.3L5 19z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg></div><div class="tour-ripple"></div></div>
  <div class="tour-bar">
    <button type="button" class="tb" data-act="prev" aria-label="上一步">‹</button>
    <button type="button" class="tb tb-main" data-act="play">播放</button>
    <button type="button" class="tb" data-act="next" aria-label="下一步">›</button>
    <p class="tour-cap" aria-live="polite"></p>
    <span class="tour-count muted"></span>
  </div>
  <script type="application/json" class="tour-steps">["打开“迁移任务”并单击“新建迁移任务”。","选择源租户和目标租户。","筛选并勾选要迁移的源用户，然后单击“下一步”。","勾选表头复选框，选择筛选器显示的所有行。","一次性为所有已勾选的行设置目标域。","选择内容、计划和线程数。","保存迁移任务。"]</script>
</figure>
<figure class="tour" data-tour="run">
  <figcaption class="tour-head"><strong>运行、暂停和继续</strong><span class="muted">迁移任务的运行栏</span></figcaption>
  <div class="tour-stage"><img class="tour-img" alt="运行、暂停和继续"><div class="tour-box"></div><div class="tour-cursor" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 2l16 9.5-7 1.6 3.9 7.3-2.9 1.5-3.9-7.3L5 19z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg></div><div class="tour-ripple"></div></div>
  <div class="tour-bar">
    <button type="button" class="tb" data-act="prev" aria-label="上一步">‹</button>
    <button type="button" class="tb tb-main" data-act="play">播放</button>
    <button type="button" class="tb" data-act="next" aria-label="下一步">›</button>
    <p class="tour-cap" aria-live="polite"></p>
    <span class="tour-count muted"></span>
  </div>
  <script type="application/json" class="tour-steps">["运行栏显示迁移任务正在做什么以及接下来做什么。","单击“立即开始”立即复制。","“复制进度”显示每个邮箱和 OneDrive 及其速度。","“暂停”会安全地停止线程并挂起计划。","“继续”复制剩余内容；不会重复复制任何内容。"]</script>
</figure>
<figure class="tour" data-tour="issues">
  <figcaption class="tour-head"><strong>处理待决定事项</strong><span class="muted">“待您决定”面板</span></figcaption>
  <div class="tour-stage"><img class="tour-img" alt="处理待决定事项"><div class="tour-box"></div><div class="tour-cursor" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 2l16 9.5-7 1.6 3.9 7.3-2.9 1.5-3.9-7.3L5 19z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg></div><div class="tour-ripple"></div></div>
  <div class="tour-bar">
    <button type="button" class="tb" data-act="prev" aria-label="上一步">‹</button>
    <button type="button" class="tb tb-main" data-act="play">播放</button>
    <button type="button" class="tb" data-act="next" aria-label="下一步">›</button>
    <p class="tour-cap" aria-live="polite"></p>
    <span class="tour-count muted"></span>
  </div>
  <script type="application/json" class="tour-steps">["365MG 不会自行处理的事项都分组列在这里。","展开一个组，查看每个用户及其操作。","复制用于创建缺失 OneDrive 的命令。","跳过许可证被有意删除的用户。"]</script>
</figure>
<figure class="tour" data-tour="report">
  <figcaption class="tour-head"><strong>导出报告</strong><span class="muted">按用户对比源与已复制数量</span></figcaption>
  <div class="tour-stage"><img class="tour-img" alt="导出报告"><div class="tour-box"></div><div class="tour-cursor" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 2l16 9.5-7 1.6 3.9 7.3-2.9 1.5-3.9-7.3L5 19z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg></div><div class="tour-ripple"></div></div>
  <div class="tour-bar">
    <button type="button" class="tb" data-act="prev" aria-label="上一步">‹</button>
    <button type="button" class="tb tb-main" data-act="play">播放</button>
    <button type="button" class="tb" data-act="next" aria-label="下一步">›</button>
    <p class="tour-cap" aria-live="polite"></p>
    <span class="tour-count muted"></span>
  </div>
  <script type="application/json" class="tour-steps">["打开“报告”并选择一个迁移任务。","总计、需要查看的用户、组和备注。","“导出 HTML”会生成并打开一个独立页面。"]</script>
</figure>
<figure class="tour" data-tour="language">
  <figcaption class="tour-head"><strong>更改语言</strong><span class="muted">九种语言，包括从右到左</span></figcaption>
  <div class="tour-stage"><img class="tour-img" alt="更改语言"><div class="tour-box"></div><div class="tour-cursor" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M4 2l16 9.5-7 1.6 3.9 7.3-2.9 1.5-3.9-7.3L5 19z" fill="#111" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg></div><div class="tour-ripple"></div></div>
  <div class="tour-bar">
    <button type="button" class="tb" data-act="prev" aria-label="上一步">‹</button>
    <button type="button" class="tb tb-main" data-act="play">播放</button>
    <button type="button" class="tb" data-act="next" aria-label="下一步">›</button>
    <p class="tour-cap" aria-live="polite"></p>
    <span class="tour-count muted"></span>
  </div>
  <script type="application/json" class="tour-steps">["打开“设置”。","选择一种语言：立即生效。","阿拉伯语会将整个布局切换为从右到左。"]</script>
</figure>
